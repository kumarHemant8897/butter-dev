# Supabase CLI configuration for the LOCAL development stack (`supabase start`).
# Hosted projects are configured in the Supabase Dashboard; nothing secret belongs in this file.
# Full reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "butter"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Hard cap on rows per request, so a missing limit can never return a whole table.
max_rows = 200

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false
